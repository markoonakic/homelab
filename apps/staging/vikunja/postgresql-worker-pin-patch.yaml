apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: vikunja
spec:
  replicas: 0
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos-awe-w01
