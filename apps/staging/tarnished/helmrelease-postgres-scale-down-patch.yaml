apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tarnished-postgres
  namespace: tarnished
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: StatefulSet
              name: tarnished-postgres-postgresql
            patch: |
              - op: replace
                path: /spec/replicas
                value: 0
