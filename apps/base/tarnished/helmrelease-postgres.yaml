apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tarnished-postgres
  namespace: tarnished
spec:
  interval: 30m
  chart:
    spec:
      chart: postgresql
      version: "16.x.x"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: tarnished
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: bitnami/postgresql
      tag: "16-debian-12"
    auth:
      database: tarnished
      username: tarnished
      existingSecret: tarnished-secrets
      secretKeys:
        userPasswordKey: postgres-password
    primary:
      persistence:
        enabled: true
        size: 5Gi
        storageClass: longhorn
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
