apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tarnished
  namespace: tarnished
spec:
  interval: 15m
  chart:
    spec:
      chart: tarnished
      version: "0.1.22"
      sourceRef:
        kind: HelmRepository
        name: ghcr-tarnished
        namespace: tarnished
      interval: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    ingress:
      enabled: true
      className: traefik
      host: tarnished.sarma.love
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        enabled: true
        secretName: sarma-wildcard-tls

    persistence:
      enabled: true
      existingClaim: tarnished-uploads

    # SQLite mode (PostgreSQL disabled)
    postgresql:
      enabled: false

    secretKey:
      existingSecret: tarnished-secrets
      existingSecretKey: secret-key

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    initContainer:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
