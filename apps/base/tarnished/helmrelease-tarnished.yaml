apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tarnished
  namespace: tarnished
spec:
  interval: 15m
  chart:
    spec:
      chart: tarnished
      version: "0.1.1"
      sourceRef:
        kind: HelmRepository
        name: ghcr-tarnished
        namespace: tarnished
      interval: 5m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    image:
      repository: ghcr.io/markoonakic/tarnished
      tag: "0.1.1"

    postgresql:
      enabled: true
      host: tarnished-postgres
      database: tarnished
      user: tarnished
      existingSecret: tarnished-secrets
      existingSecretPasswordKey: postgres-password

    secretKey:
      existingSecret: tarnished-secrets
      existingSecretKey: secret-key

    persistence:
      enabled: true
      existingClaim: tarnished-uploads

    ingress:
      enabled: true
      className: traefik
      host: tarnished.sarma.love
      tls:
        enabled: true
        secretName: sarma-wildcard-tls
