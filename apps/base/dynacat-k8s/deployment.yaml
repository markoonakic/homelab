apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynacat-k8s
  namespace: dynacat-k8s
  labels:
    app.kubernetes.io/name: dynacat-k8s
    app.kubernetes.io/component: dashboard-extension
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dynacat-k8s
      app.kubernetes.io/component: dashboard-extension
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynacat-k8s
        app.kubernetes.io/component: dashboard-extension
    spec:
      serviceAccountName: dynacat-k8s
      automountServiceAccountToken: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dynacat-k8s
          # Temporary implementation image: this binary serves a Dynacat/Glance-compatible
          # extension API. RBAC and service exposure below restrict it to the nodes view only.
          image: ghcr.io/lukasdietrich/glance-k8s/glance-k8s:v0.4.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
