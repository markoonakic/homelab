apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dynacat-k8s-nodes
  labels:
    app.kubernetes.io/name: dynacat-k8s
    app.kubernetes.io/component: dashboard-extension
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
