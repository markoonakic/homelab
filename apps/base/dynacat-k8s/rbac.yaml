  name: dynacat-k8s-nodes
  labels:
    app.kubernetes.io/name: dynacat-k8s
    app.kubernetes.io/component: dashboard-extension
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dynacat-k8s-nodes
subjects:
  - kind: ServiceAccount
    name: dynacat-k8s
    namespace: dynacat-k8s
