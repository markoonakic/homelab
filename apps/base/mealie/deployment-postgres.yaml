apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie-postgres
  namespace: mealie
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
      component: postgres
  template:
    metadata:
      labels:
        app: mealie
        component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: volume-setup
          image: busybox:1.37
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          command:
            - sh
            - -c
            - |
              echo "Preparing postgres volume..."
              rm -rf /var/lib/postgresql/data/lost+found
              mkdir -p /var/lib/postgresql/data
              chmod 775 /var/lib/postgresql/data
              echo "Volume preparation complete"
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "mealie"
            - name: POSTGRES_USER
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: postgres-run
              mountPath: /var/run/postgresql
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mealie
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mealie
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-postgres-data
        - name: tmp
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
