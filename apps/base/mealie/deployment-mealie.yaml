apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
      component: web
  template:
    metadata:
      labels:
        app: mealie
        component: web
    spec:
      initContainers:
        - name: volume-setup
          image: busybox:1.36
          volumeMounts:
            - name: data
              mountPath: /app/data
          command:
            - sh
            - -c
            - |
              echo "Preparing mealie volume..."
              rm -rf /app/data/lost+found
              mkdir -p /app/data
              chmod 755 /app/data
              echo "Volume preparation complete"
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v2.4.0
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            # Database Configuration
            - name: DB_ENGINE
              value: "postgres"
            - name: POSTGRES_SERVER
              value: "mealie-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "mealie"
            - name: POSTGRES_USER
              value: "mealie"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: postgres-password
            # Application Settings
            - name: BASE_URL
              value: "https://mealie.sarma.love"
            - name: TZ
              value: "Europe/Belgrade"
            - name: ALLOW_SIGNUP
              value: "true"
            - name: DEFAULT_EMAIL
              value: "admin@mealie.local"
            - name: DEFAULT_GROUP
              value: "Home"
            - name: DEFAULT_HOUSEHOLD
              value: "Family"
            # OpenAI Configuration
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mealie-secrets
                  key: openai-api-key
            - name: OPENAI_MODEL
              value: "gpt-4o"
            - name: OPENAI_BASE_URL
              value: ""
            - name: OPENAI_SEND_DATABASE_DATA
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 400Mi
            limits:
              cpu: 1000m
              memory: 1500Mi
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-app-data
