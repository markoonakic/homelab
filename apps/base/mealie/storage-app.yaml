apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-app-data
  namespace: mealie
  labels:
    recurring-job.longhorn.io/source: "enabled"
    recurring-job.longhorn.io/snapshot-daily: "enabled"
  annotations:
    longhorn.io/replicas: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
