apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vikunja
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: flux-system
  targetNamespace: vikunja
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: vikunja-vikunja
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.kubernetes.io/worker
                              operator: Exists
          - target:
              kind: Deployment
              name: vikunja-vikunja-typesense
            patch: |
              - op: add
                path: /spec/template/spec/affinity
                value:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: node-role.kubernetes.io/worker
                              operator: Exists
  values:
    vikunja:
      # Environment variables for database connection
      env:
        VIKUNJA_DATABASE_TYPE: "postgres"
        VIKUNJA_DATABASE_HOST: "postgresql"
        VIKUNJA_DATABASE_USER: "vikunja"
        VIKUNJA_DATABASE_DATABASE: "vikunja"
        VIKUNJA_DATABASE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: postgres-password
        VIKUNJA_SERVICE_JWTSECRET:
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: jwt-secret

      # Vikunja configuration (non-sensitive settings)
      configMaps:
        api-config:
          enabled: true
          data:
            config.yml: |
              service:
                enableregistration: true
                frontendurl: "https://vikunja.sarma.love"
              files:
                maxsize: 20MB
              typesense:
                enabled: true
                url: "http://vikunja-vikunja-typesense:8108"
                apikey: "typesense"

      # Persistence for file attachments
      persistence:
        data:
          enabled: true
          storageClass: longhorn
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /app/vikunja/files

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # Disable PostgreSQL subchart - we deploy separately
    # Note: auth and global values required even when disabled due to template bug
    postgresql:
      enabled: false
      global:
        postgresql:
          auth:
            username: vikunja
            database: vikunja
      auth:
        username: vikunja
        database: vikunja

    # Redis disabled (single replica, not needed)
    redis:
      enabled: false

    # Typesense enabled for better search
    typesense:
      enabled: true
