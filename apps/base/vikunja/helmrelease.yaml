apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vikunja
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: flux-system
  targetNamespace: vikunja
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    vikunja:
      # Environment variables for secrets and database connection
      env:
        VIKUNJA_DATABASE_TYPE: "postgres"
        VIKUNJA_DATABASE_HOST: "vikunja-postgresql"
        VIKUNJA_DATABASE_USER: "vikunja"
        VIKUNJA_DATABASE_DATABASE: "vikunja"
        VIKUNJA_DATABASE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: postgresql-password
        VIKUNJA_SERVICE_JWTSECRET:
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: jwt-secret

      # Vikunja configuration (non-sensitive settings)
      configMaps:
        api-config:
          enabled: true
          data:
            config.yml: |
              service:
                enableregistration: true
                frontendurl: "https://vikunja.sarma.love"
              files:
                maxsize: 20MB

      # Persistence for file attachments
      persistence:
        data:
          enabled: true
          storageClass: longhorn
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /app/vikunja/files

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # PostgreSQL subchart - using official postgres image
    postgresql:
      enabled: true
      image:
        registry: docker.io
        repository: postgres
        tag: "17"
      auth:
        username: vikunja
        database: vikunja
        existingSecret: vikunja-secrets
        secretKeys:
          adminPasswordKey: postgresql-password
          userPasswordKey: postgresql-password
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 3Gi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # Redis disabled (single replica, not needed)
    redis:
      enabled: false

    # Typesense enabled for better search
    typesense:
      enabled: true
