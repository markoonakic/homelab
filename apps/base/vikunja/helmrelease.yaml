apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vikunja
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: vikunja
        namespace: flux-system
  targetNamespace: vikunja
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    vikunja:
      # Vikunja configuration
      configMaps:
        api-config:
          enabled: true
          data:
            config.yml: |
              service:
                enableregistration: true
                frontendurl: "https://vikunja.sarma.love"
              database:
                type: postgres
                host: vikunja-vikunja-postgresql
                database: vikunja
                user: vikunja
              files:
                maxsize: 20MB

      # Environment variables for secrets
      env:
        VIKUNJA_DATABASE_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: vikunja-secrets
              key: postgresql-password

      # Persistence for file attachments
      persistence:
        data:
          enabled: true
          storageClass: longhorn
          accessMode: ReadWriteOnce
          size: 2Gi
          mountPath: /app/vikunja/files

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    # PostgreSQL subchart
    postgresql:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/postgresql
        tag: "16"
      auth:
        username: vikunja
        database: vikunja
        existingSecret: vikunja-secrets
        secretKeys:
          userPasswordKey: postgresql-password
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 3Gi
          annotations:
            longhorn.io/replicas: "2"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # Redis disabled (single replica, not needed)
    redis:
      enabled: false
