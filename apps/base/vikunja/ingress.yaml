apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
  namespace: vikunja
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vikunja.sarma.love
      secretName: sarma-wildcard-tls
  rules:
    - host: vikunja.sarma.love
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja-vikunja
                port:
                  number: 3456
