apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-meilisearch-data-v113
  namespace: karakeep
  labels:
    recurring-job.longhorn.io/source: "enabled"
    recurring-job.longhorn.io/snapshot-daily: "enabled"
  annotations:
    longhorn.io/replicas: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
