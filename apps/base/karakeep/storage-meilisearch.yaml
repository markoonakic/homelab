apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-meilisearch-data
  namespace: karakeep
  labels:
    recurring-job.longhorn.io/source: "enabled"
    recurring-job.longhorn.io/snapshot-daily: "enabled"
  annotations:
    longhorn.io/replicas: "2"
    homelab.sarma.love/retained-for-rollback: "meilisearch-v1.11.3"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
