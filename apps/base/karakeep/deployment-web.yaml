apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-web
  namespace: karakeep
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: karakeep
      component: web
  template:
    metadata:
      labels:
        app: karakeep
        component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
      initContainers:
        - name: runtime-dir-setup
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              mkdir -p /runtime/run /runtime/tmp
              chmod 755 /runtime/run
              chmod 1777 /runtime/tmp
          volumeMounts:
            - name: runtime
              mountPath: /runtime
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:0.31.0
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXTAUTH_URL
              value: "https://karakeep.sarma.love"
            - name: DATA_DIR
              value: "/data"
            - name: DISABLE_SIGNUPS
              value: "false"
            - name: DATABASE_URL
              value: "file:/data/karakeep.db"
            - name: MEILI_ADDR
              value: "http://karakeep-meilisearch:7700"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: meili-master-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: openai-api-key
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: openai-base-url
            - name: INFERENCE_TEXT_MODEL
              value: "gpt-oss-120b"
            - name: INFERENCE_OUTPUT_SCHEMA
              value: "json"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: karakeep-secrets
                  key: nextauth-secret
            - name: BROWSER_WEB_URL
              value: "http://$(KARAKEEP_CHROME_SERVICE_HOST):$(KARAKEEP_CHROME_SERVICE_PORT_HTTP)"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /run
              subPath: run
            - name: runtime
              mountPath: /tmp
              subPath: tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-web-data
        - name: runtime
          emptyDir: {}
