apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: vaultwarden
      version: "1.2.6"
      sourceRef:
        kind: HelmRepository
        name: gissilabs
        namespace: flux-system
  targetNamespace: vaultwarden
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: PersistentVolumeClaim
              name: vaultwarden-vaultwarden
            patch: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata:
                name: vaultwarden-vaultwarden
                labels:
                  recurring-job.longhorn.io/source: "enabled"
                  recurring-job.longhorn.io/snapshot-daily: "enabled"
  values:
    image:
      repository: vaultwarden/server
      tag: 1.35.4-alpine

    env:
      TZ: "Europe/Belgrade"
      DOMAIN: "https://vault.sarma.love"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      SHOW_PASSWORD_HINT: "false"

    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi
      annotations:
        # Force 3 replicas for critical password vault data
        longhorn.io/replicas: "3"

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    strategy:
      type: Recreate

    ingress:
      enabled: false
