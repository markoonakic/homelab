apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-lapi-data
  namespace: crowdsec
  annotations:
    longhorn.io/replicas: "2"  # Tier 2: Important data (attack decisions)
    recurring-job-selectors.longhorn.io: '[{"name":"snapshot-daily", "isGroup":false}]'
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
