apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: backup-target
  labels:
    app.kubernetes.io/name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos-dy9-gja
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: verify-host-capacity
          image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              set -- $(df -Pk /data | awk 'NR == 2 { print $2, $4 }')
              capacity_kib=$1
              available_kib=$2
              required_kib=$((capacity_kib / 4 + 10 * 1024 * 1024))
              used_kib=$(du -sk /data | awk '{ print $1 }')
              test "$available_kib" -ge "$required_kib"
              test "$used_kib" -lt $((10 * 1024 * 1024))
              chown 1000:1000 /data
              chmod 0770 /data
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
          args:
            - server
            - /data
            - --address
            - :9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  df -Pk /data | {
                    read -r _
                    read -r _ capacity_kib _ available_kib _ _
                    test "$available_kib" -ge $((capacity_kib / 4 + 10 * 1024 * 1024))
                  }
                  set -- $(du -sk /data)
                  test "$1" -lt $((10 * 1024 * 1024))
                  curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 1
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 10Gi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 10Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /var/lib/backup-target
            type: DirectoryOrCreate
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
